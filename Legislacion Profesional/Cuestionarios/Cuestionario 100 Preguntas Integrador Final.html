<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco de 100 preguntas · Integrador Final</title>
<style>
  :root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#dedcd3;--acc:#2f5d8a;--ok:#1f7a4d;--okbg:#e4f3ea;--bad:#b3261e;--badbg:#fbe9e7;--warnbg:#fff3d6}
  @media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--ink:#ecebe6;--mute:#a09f97;--line:#3a3a37;--acc:#7fb0e0;--ok:#6fd0a0;--okbg:#17332a;--bad:#ff8a80;--badbg:#3a1f1c;--warnbg:#3a3014}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:1.5rem;margin:0 0 4px}
  .sub{color:var(--mute);margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .modes{display:grid;gap:10px}
  .mode{text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:14px}
  .mode:hover{border-color:var(--acc)}
  .mode b{display:block}
  .mode span{color:var(--mute);font-size:.9rem}
  .bar{position:sticky;top:0;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;z-index:5;margin-bottom:16px}
  .prog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
  .meta{font-variant-numeric:tabular-nums;color:var(--mute);font-size:.9rem;white-space:nowrap}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;font-size:.75rem}
  .tag{padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
  .tag.u{background:var(--acc);border-color:var(--acc);color:#fff}
  .case{border-left:3px solid var(--acc);padding-left:12px;margin:0 0 10px}
  .qt{margin:0 0 12px;font-weight:600}
  label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
  label.opt:hover{border-color:var(--acc)}
  label.opt input{margin-top:5px;accent-color:var(--acc)}
  label.opt.ok{background:var(--okbg);border-color:var(--ok)}
  label.opt.bad{background:var(--badbg);border-color:var(--bad)}
  table{border-collapse:collapse;width:100%}
  td{padding:6px 4px;vertical-align:middle;border-bottom:1px solid var(--line)}
  td:last-child{width:46%}
  select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
  select.ok{border-color:var(--ok);background:var(--okbg)} select.bad{border-color:var(--bad);background:var(--badbg)}
  textarea{min-height:120px;resize:vertical}
  .fb{margin-top:12px;padding:12px;border-radius:8px;font-size:.93rem}
  .fb.ok{background:var(--okbg)} .fb.bad{background:var(--badbg)} .fb.mid{background:var(--warnbg)}
  .fb b.v{display:block;margin-bottom:4px}
  .fb ul{margin:6px 0 0;padding-left:18px}
  .rub label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
  button{font:inherit;border:0;border-radius:8px;padding:10px 18px;background:var(--acc);color:#fff;cursor:pointer}
  button.sec{background:transparent;color:var(--acc);border:1px solid var(--acc)}
  button:disabled{opacity:.5;cursor:default}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .score{font-size:2.2rem;font-weight:700}
  .hint{color:var(--mute);font-size:.85rem}
  .unit-row{display:flex;gap:10px;align-items:center;margin:4px 0}
  .unit-row .ub{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .unit-row .ub i{display:block;height:100%;background:var(--acc)}
  .rev li{margin-bottom:8px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Banco de 100 preguntas · Integrador Final</h1>
  <p class="sub">Legislación Profesional · Unidades 1 a 5 · dificultad alta · respuestas con el artículo clave</p>

  <section id="menu"></section>
  <section id="play" hidden>
    <div class="bar">
      <div class="prog"><i id="pb"></i></div>
      <span class="meta"><span id="pos">1/10</span> · <span id="clock">00:00</span></span>
      <button class="sec" id="quit">Salir</button>
    </div>
    <div id="qcard" class="card"></div>
    <div class="actions"><button id="check">Comprobar</button><button id="next" hidden>Siguiente</button></div>
  </section>
  <section id="end" hidden></section>
</main>

<script>
/* ============ BANCO ============ */
const B=[];
const M =(u,t,q,ok,bad,e,c)=>B.push({k:"mc", u,t,q,c,e,o:[{x:ok,ok:1},...bad.map(x=>({x}))]});
const M2=(u,t,q,oks,bad,e,c)=>B.push({k:"mc2",u,t,q,c,e,o:[...oks.map(x=>({x,ok:1})),...bad.map(x=>({x}))]});
const V =(u,t,q,a,e)=>B.push({k:"vf",u,t,q,a,e});
const R =(u,t,q,pairs,extra,e)=>B.push({k:"rel",u,t,q,pairs,extra,e});
const D =(u,t,q,rub,model,c)=>B.push({k:"dev",u,t,q,c,rub,model});

/* ---------- U1 · Propiedad intelectual y derecho de autor (22) ---------- */
M("U1","Qué protege el derecho de autor (art. 1)","Según el art. 1 de la Ley 11.723, ¿qué queda FUERA de la protección?",
  "Las ideas, procedimientos, métodos de operación y conceptos matemáticos en sí mismos",
  ["Los programas de computación en código fuente","Los programas de computación en código objeto","Las compilaciones de datos"],
  "Se protege la expresión, no la idea (art. 1 in fine). Los programas (fuente y objeto) y las compilaciones de datos sí están incluidos.");
M("U1","Plazo del derecho patrimonial (art. 5)","¿Cuánto dura el derecho patrimonial del autor persona humana?",
  "Toda su vida más 70 años, contados desde el 1.º de enero del año siguiente a su muerte",
  ["Toda su vida más 50 años desde la muerte","70 años desde la primera publicación","50 años desde el 1.º de enero siguiente a la muerte"],
  "Art. 5: vida + 70 años desde el 1/1 del año siguiente a la muerte. Los 50 años son de personas jurídicas (art. 8) y cine.");
M("U1","Titulares del derecho de autor (art. 4)","¿Quién NO figura entre los titulares del derecho de autor según el art. 4?",
  "El usuario que adquirió una licencia de uso del programa",
  ["Los herederos o derechohabientes del autor","Quien, con permiso del autor, traduce, adapta o modifica la obra","La persona jurídica cuyos dependientes crearon un programa en el desempeño de sus funciones, salvo pacto en contrario"],
  "Quien compra una licencia recibe una autorización de uso, no la titularidad: el autor la conserva (art. 55 bis). Las otras tres sí están en el art. 4 (inc. d para dependientes).");
M("U1","Software libre ≠ gratuito","¿Qué significa que un software sea «libre»?",
  "Que el autor concede las libertades de usar, estudiar y modificar, distribuir copias, y mejorar y publicar las mejoras; puede venderse",
  ["Que se distribuye sin costo y sin acceso al código fuente","Que su autor renunció a la titularidad y pasó a dominio público","Que no tiene licencia, por lo que puede usarse sin condiciones"],
  "Libre se refiere a libertades (4 libertades, FSF/GNU), no al precio. Lo gratuito sin esas libertades es freeware. El autor conserva la titularidad y la licencia sigue existiendo.");
M("U1","Copyleft vs. permisiva (fork)","Un equipo toma un proyecto bajo GPL v3, lo modifica y quiere venderlo como producto privativo de código cerrado. ¿Qué ocurre?",
  "No puede: el copyleft exige que las obras derivadas sigan siendo libres y bajo la misma licencia",
  ["Puede, porque la GPL permite cerrar el código si se menciona al autor original","Puede, porque el software libre es de dominio público","Puede, pero solo si paga una regalía a la FSF"],
  "Con copyleft no se puede cerrar un derivado. Solo con licencia permisiva el fork a proyecto privativo es posible.",
  "Caso");
M("U1","Patentes y software (Ley 24.481 art. 6)","¿Por qué, en general, el software no se patenta en Argentina?",
  "Porque el art. 6 de la Ley 24.481 lo excluye, salvo que esté embebido en hardware y sea imprescindible para su funcionamiento",
  ["Porque la Ley 11.723 prohíbe expresamente patentarlo","Porque solo pueden patentarse inventos de empresas extranjeras","Porque ningún programa puede ser original"],
  "Se protege por derecho de autor (obra literaria), complementado con medidas contractuales y técnicas. La patente exige novedad, altura inventiva y aplicabilidad industrial.");
M("U1","Copia de salvaguardia y licencia de uso (art. 9)","Una empresa recibe una licencia de uso de un software. Respecto de las copias, ¿qué puede hacer?",
  "Una única copia de salvaguardia, que solo reemplaza al original si este se pierde o se inutiliza",
  ["Todas las copias que necesite para instalarlo en distintos equipos propios","Ninguna copia, bajo ninguna circunstancia","Una copia privada completa para cada empleado"],
  "Art. 9 (Ley 25.036): una única copia. No existe un régimen general de copia privada.");
M2("U1","Derechos morales: características","Elegí las DOS características correctas de los derechos morales del autor:",
  ["Son perpetuos","Son inalienables, irrenunciables e inembargables"],
  ["Son temporales: duran la vida del autor más 70 años","Son transmisibles y embargables"],
  "Los morales son perpetuos e inalienables, irrenunciables e inembargables. Temporales, transmisibles, renunciables y embargables son los patrimoniales.");
M("U1","Registro y art. 63","Según el art. 63 de la Ley 11.723, la falta de inscripción de la obra…",
  "suspende el derecho del autor hasta que se inscribe",
  ["extingue definitivamente el derecho del autor","hace que la obra pase al dominio público","no produce ninguna consecuencia sobre sus derechos"],
  "Art. 63: la falta de inscripción suspende el derecho hasta que se inscribe. El art. 62 dice que el depósito garantiza los derechos; el registro se hace ante la DNDA (art. 57).");

V("U1","Internacionalidad de la obra","«Las patentes y las marcas, a diferencia de las obras protegidas por derecho de autor, gozan de la misma protección en todos los países.»",false,
  "Es al revés: la obra goza de internacionalidad; patentes y marcas son territoriales.");
V("U1","Expresión vs. idea","«El derecho de autor protege la expresión de la obra, y por eso el software se tutela como obra literaria.»",true,
  "El art. 1 incluye los programas fuente y objeto. Se protege la expresión, no la idea ni el método.");
V("U1","Morales vs. patrimoniales","«Los derechos patrimoniales son temporales, transmisibles y embargables, mientras que los morales son perpetuos e inalienables.»",true,
  "Es la distinción básica: explotación económica vs. personalidad del autor sobre su obra.");
V("U1","Facultades morales: retracto vs. integridad","«El derecho de retracto permite al autor oponerse a deformaciones de su obra.»",false,
  "Eso es el derecho a la integridad. El retracto es retirar la obra del comercio por cambio de convicciones.");
V("U1","Sanción de la copia ilegal (art. 71)","«La Ley 11.723 sanciona la copia ilegal de software con la pena del hurto.»",false,
  "El art. 71 remite al art. 172 del Código Penal: es estafa, no hurto, robo ni otra figura.");
V("U1","Plazo de obras cinematográficas","«Las obras cinematográficas duran 50 años desde la muerte del último colaborador (autor del argumento, productor, director).»",true,
  "Cine: 50 años desde la muerte del último colaborador (arts. 34 y 20). Fotográficas: 20 años desde la primera publicación.");
V("U1","Símbolo © y tratados","«El símbolo © seguido del titular y el año de primera publicación fue introducido por el Convenio de Berna de 1886.»",false,
  "Lo introdujo la Convención Universal (Ginebra, 1952), que permitió adherirse a países fuera de Berna, como EE. UU. Berna fijó el trato nacional y los derechos morales.");

R("U1","Plazos de protección","Relacioná cada obra o titular con su plazo. Sobran valores.",
  [["Autor, persona humana","Vida + 70 años desde el 1/1 siguiente a la muerte"],
   ["Obra anónima de una persona jurídica","50 años desde la publicación"],
   ["Obras fotográficas (Ley 11.723)","20 años desde la primera publicación"],
   ["Obras cinematográficas","50 años desde la muerte del último colaborador"]],
  ["25 años desde la primera publicación (Berna)","Vida + 50 años"],
  "Persona jurídica: art. 8. Fotos: art. 34 (los 25 años son los de Berna). Cine: arts. 34 y 20.");
R("U1","Facultades de los derechos morales","Relacioná cada facultad con su contenido. Sobra un valor.",
  [["Divulgación","Publicar la obra o mantenerla inédita"],
   ["Paternidad","Ser reconocido como autor"],
   ["Integridad","Oponerse a deformaciones de la obra"],
   ["Retracto","Retirar la obra del comercio por cambio de convicciones"]],
  ["Traducir o adaptar la obra"],
  "Traducir/adaptar es transformación, una facultad patrimonial (junto a reproducción, comunicación pública y distribución).");
R("U1","Tratados internacionales","Relacioná cada tratado con su idea clave. Sobra un valor.",
  [["Convenio de Berna (1886)","Trato nacional y derechos morales"],
   ["Convención Universal de Ginebra (1952)","Permitió adherirse a países fuera de Berna; usa el símbolo ©"],
   ["Convención de Roma (1961)","Derechos conexos: intérpretes, fonogramas, radiodifusión"],
   ["Tratado OMPI (WCT)","Derecho de autor en el entorno digital: programas y compilaciones de datos"]],
  ["Régimen territorial de patentes y marcas"],
  "Patentes y marcas son territoriales y no son objeto de estos tratados de derecho de autor.");

D("U1","Derechos morales y patrimoniales","Desarrollo corto: explicá y diferenciá los derechos morales y patrimoniales del autor. No alcanza con enumerar: clasificá y completá con las facultades.",
  ["Define ambos: morales (personalidad del autor sobre su obra) y patrimoniales (explotación económica).",
   "Morales: perpetuos, inalienables, irrenunciables e inembargables.",
   "Facultades morales: divulgación, paternidad, integridad y retracto.",
   "Patrimoniales: temporales (vida + 70), transmisibles, renunciables y embargables.",
   "Facultades patrimoniales: reproducción, comunicación pública, transformación y distribución."],
  "Morales: protegen la personalidad del autor; perpetuos, inalienables, irrenunciables, inembargables; divulgación, paternidad, integridad, retracto. Patrimoniales: protegen la explotación económica; temporales (vida + 70 años), transmisibles, renunciables, embargables; reproducción, comunicación pública, transformación, distribución. Art. 2 enumera las facultades y el autor elige la licencia (art. 55 bis).");
D("U1","Elección de licencia (copyleft)","Desarrollo corto: ¿qué tipo de licencia elegirías y por qué? Explicá la diferencia con la alternativa y aclará si «libre» implica «gratis».",
  ["Elige una licencia libre con copyleft (ej. GPL v3).",
   "Explica que las obras derivadas deben seguir siendo libres bajo la misma licencia.",
   "Contrasta con la licencia permisiva, que permite redistribuir incluso cerrando el código.",
   "Aclara que libre no es gratuito (puede venderse) y que el autor conserva la titularidad."],
  "Copyleft (ej. GPL v3): cualquiera puede usar, modificar y redistribuir, pero los derivados deben mantener la misma licencia, por lo que nadie puede convertir el código en privativo. Una permisiva permitiría cerrar el código en un fork. Libre refiere a libertades, no al precio; el autor conserva siempre la titularidad.",
  "Caso: Un estudio publica una librería. Quiere que cualquiera la use y la modifique, pero que ningún tercero pueda convertirla en un producto cerrado.");
D("U1","Registro de software ante la DNDA","Desarrollo corto: ¿dónde y cómo se registra un software? Citá los artículos clave y las consecuencias de no registrar.",
  ["Indica la Dirección Nacional del Derecho de Autor (DNDA).",
   "Cita el art. 57: depósito de lo que fije la reglamentación; lo hace el autor, titular o su designado.",
   "Describe el trámite «Inscripción de obra publicada de Software»: completar datos, subir comprobante de pago del trámite y de la tasa, depositar la obra.",
   "Cita el art. 62 (el depósito garantiza los derechos) y el art. 63 (la falta de inscripción suspende el derecho)."],
  "Se registra ante la DNDA. Art. 57: se deposita lo que fije la reglamentación. Trámite: «Inscripción de obra publicada de Software», con datos, comprobante de pago del trámite y de la tasa, y depósito de la obra. Art. 62: el depósito garantiza los derechos. Art. 63: la falta de inscripción suspende el derecho hasta que se inscribe.");

/* ---------- U2 · Contratos, firma digital y teletrabajo (18) ---------- */
M("U2","Elementos del contrato","¿Cuál de los siguientes NO es un elemento del contrato?",
  "La firma ológrafa de las partes",
  ["El consentimiento","El objeto (que debe ser lícito)","La causa"],
  "Los elementos son consentimiento, objeto y causa, todos lícitos. Rige la libertad de formas: no hace falta firma ológrafa (además existe la firma digital).");
M("U2","Contratos informáticos","¿Qué caracteriza a los contratos informáticos?",
  "Son atípicos (no regulados específicamente en el CCCN) y presentan especialidad técnica, vocabulario impreciso y estructura compleja",
  ["Son contratos típicos, regulados por un capítulo específico del CCCN","Carecen de objeto determinado, por lo que no pueden exigirse","Son siempre de adhesión"],
  "Se aplican las reglas generales del contrato. No siempre son de adhesión: el software a medida se negocia; el «enlatado» suele ser de adhesión.");
M("U2","Servicios vs. obra (caso)","Una empresa contrata a un técnico por horas para el soporte de sus servidores, sin comprometer un resultado concreto. ¿Cómo se califica?",
  "Locación de servicios: obligación de medios, donde el acreedor debe probar dolo o culpa",
  ["Locación de obra: obligación de resultado, donde se presume responsable al deudor","Contrato de obra con objeto complejo","Compraventa de software"],
  "Servicio = actividad diligente (arts. 1251 y 1278 ss.). Obra = resultado (arts. 1251 y 1262 ss.). Soporte por horas, consultoría y hosting son servicios.",
  "Caso");
M("U2","Tipos de mantenimiento","Un contrato de mantenimiento incluye adaptar el sistema a una nueva normativa fiscal. ¿Qué tipo de mantenimiento es?",
  "Evolutivo",
  ["Preventivo","Correctivo planificado","Correctivo de emergencia"],
  "Evolutivo: adapta a nuevas necesidades o leyes. Preventivo evita fallas; correctivo repara fallas ya manifestadas (planificado o de emergencia).",
  "Caso");
M2("U2","Cláusulas abusivas (arts. 1092-1095)","En un contrato de consumo, elegí las DOS afirmaciones correctas sobre las cláusulas abusivas:",
  ["Son las que causan un desequilibrio significativo entre derechos y obligaciones en perjuicio del consumidor","Pueden ser abusivas aunque hayan sido negociadas o aprobadas expresamente"],
  ["Dejan de ser abusivas si el consumidor aceptó con un clic","Solo pueden existir en contratos de adhesión, nunca en negociados"],
  "El desequilibrio significativo es el criterio, y la negociación o aprobación expresa no las convalida. La adhesión (arts. 984-989) es otro régimen.");
M("U2","Infraestructura de firma digital","En la infraestructura de firma digital, ¿quién valida la identidad del solicitante de un certificado?",
  "La Autoridad de Registro",
  ["El certificador licenciado, que solo emite, revoca y publica certificados","El tercero usuario que recibe el documento","La clave pública del firmante"],
  "Cadena: ente licenciante / AC Raíz → certificador licenciado → Autoridad de Registro (valida identidad) → certificado digital → titular → terceros.");
M("U2","Teletrabajo: cuál NO es un derecho","Según la Ley 27.555, ¿cuál de las siguientes afirmaciones NO es un derecho del teletrabajador?",
  "El empleador puede instalar libremente software de vigilancia en el equipo del trabajador",
  ["Desconexión digital, sin sanción por ejercerla","Compensación de gastos: el empleador provee hardware y software y paga mantenimiento, energía y conectividad","Horarios compatibles con las tareas de cuidado de menores de 13 años, personas con discapacidad o adultos mayores convivientes"],
  "Los controles requieren participación sindical y está prohibido el software de vigilancia que viole la intimidad.");

V("U2","Objeto lícito","«El objeto del contrato puede ser ilícito siempre que el consentimiento haya sido libre.»",false,
  "Consentimiento, objeto y causa deben ser lícitos. El objeto necesariamente debe ser lícito.");
V("U2","Exclusiones de la firma digital (art. 4)","«La firma digital puede utilizarse en disposiciones por causa de muerte.»",false,
  "El art. 4 la excluye para disposiciones por causa de muerte, derecho de familia, actos personalísimos y actos que deban ser ológrafos.");
V("U2","Prueba en la locación de servicios","«En la locación de servicios, el acreedor debe probar el dolo o la culpa del deudor.»",true,
  "Obligación de medios: hay que probar la falta de diligencia. En la obra (resultado) se presume responsable al deudor que no logra el resultado.");
V("U2","Mantenimiento de software","«El mantenimiento de software es un contrato atípico y de tracto sucesivo.»",true,
  "Es atípico, de tracto sucesivo y de hacer, de resultado. Tipos: preventivo, correctivo y evolutivo.");
V("U2","Contratos de consumo a distancia (art. 1109)","«En los contratos de consumo a distancia, el lugar de cumplimiento es donde el proveedor tiene su domicilio.»",false,
  "Art. 1109: es donde el consumidor recibió la prestación, y fija la jurisdicción; la prórroga de jurisdicción se tiene por no escrita.");

R("U2","Firma digital y claves","Relacioná cada concepto con su descripción. Sobra un valor.",
  [["Firma digital","Presunción de autoría (art. 7) y de integridad (art. 8)"],
   ["Firma electrónica","Si se desconoce, quien la invoca debe acreditar su validez"],
   ["Clave privada","La conoce solo el firmante y se usa para firmar"],
   ["Clave pública","Está en el certificado y permite verificar la firma"]],
  ["Cifra el contenido del documento para garantizar confidencialidad"],
  "El par de claves garantiza autoría, integridad y no repudio, pero NO confidencialidad.");
R("U2","Actores de la infraestructura PKI","Relacioná cada actor con su función. Sobra un valor.",
  [["Certificador licenciado","Emite, revoca y publica certificados"],
   ["Autoridad de Registro","Valida la identidad del solicitante"],
   ["Certificado digital","Vincula la clave pública con su titular e indica su vigencia"],
   ["Autoridad de aplicación (AC Raíz)","Ente licenciante de los certificadores"]],
  ["Acredita el contenido del documento firmado"],
  "El certificado no acredita el contenido del documento sino el vínculo clave–titular.");
R("U2","Mantenimiento y objeto del contrato de obra","Relacioná cada figura con su definición. Sobra un valor.",
  [["Mantenimiento preventivo","Evita que se produzcan fallas"],

/* ============ MOTOR ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const KIND={mc:"Opción múltiple",mc2:"Opción múltiple · DOS correctas",vf:"Verdadero / Falso",rel:"Relacionar",dev:"Desarrollo corto"};
B.forEach((q,i)=>q.id=i);

let pool=[],idx=0,results=[],checked=false,t0=0,timer=null,cur=null,lastMode="";

function showMenu(){
  $("#play").hidden=true;$("#end").hidden=true;$("#menu").hidden=false;
  const cnt=u=>B.filter(q=>q.u===u).length;
  $("#menu").innerHTML=`<div class="card"><b>Banco: ${B.length} preguntas</b>
    <p class="hint">${["mc","mc2","vf","rel","dev"].map(k=>KIND[k]+" "+B.filter(q=>q.k===k).length).join(" · ")}. Los casos de U4 y U5 piden identificar delito/artículo o tipo de responsabilidad.</p></div>
    <div class="modes">
      <button class="mode" data-m="sim"><b>Simulacro de examen (10 al azar)</b><span>4 opción múltiple, 3 V/F, 1 relacionar y 2 de desarrollo, de todas las unidades. Unos 15 minutos.</span></button>
      <button class="mode" data-m="all"><b>Banco completo (100)</b><span>En orden de unidad, U1 a U5.</span></button>
      <button class="mode" data-m="mix"><b>Banco completo mezclado (100)</b><span>Todas las preguntas en orden aleatorio.</span></button>
      ${["U1","U2","U3","U4","U5"].map(u=>`<button class="mode" data-m="${u}"><b>Solo ${u} (${cnt(u)})</b><span>${{U1:"Propiedad intelectual y derecho de autor",U2:"Contratos, firma digital y teletrabajo",U3:"Intimidad, privacidad y datos personales",U4:"Delitos informáticos y forensia",U5:"Responsabilidad civil, penal y profesional"}[u]}</span></button>`).join("")}
      <button class="mode" data-m="cases"><b>Solo casos (U4 y U5)</b><span>Casos breves: ¿delito?, ¿qué artículo?, ¿qué responsabilidad?</span></button>
    </div>`;
}

function start(mode,custom){
  lastMode=mode;
  if(custom) pool=custom;
  else if(mode==="sim"){
    const pick=(k,n)=>shuffle(B.filter(q=>q.k===k||(k==="mc"&&q.k==="mc2"))).slice(0,n);
    pool=shuffle([...pick("mc",4),...pick("vf",3),...pick("rel",1),...pick("dev",2)]);
  }
  else if(mode==="all") pool=[...B];
  else if(mode==="mix") pool=shuffle(B);
  else if(mode==="cases") pool=B.filter(q=>(q.u==="U4"||q.u==="U5")&&(q.c||q.k==="dev"));
  else pool=B.filter(q=>q.u===mode);
  idx=0;results=[];t0=Date.now();
  clearInterval(timer);timer=setInterval(tick,1000);tick();
  $("#menu").hidden=true;$("#end").hidden=true;$("#play").hidden=false;
  show();
}
function tick(){const s=Math.floor((Date.now()-t0)/1000);$("#clock").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}

function show(){
  const q=pool[idx];checked=false;
  cur={opts:q.o?shuffle(q.o):null,rights:q.pairs?shuffle([...q.pairs.map(p=>p[1]),...(q.extra||[])]):null};
  $("#pos").textContent=(idx+1)+"/"+pool.length;
  $("#pb").style.width=(idx/pool.length*100)+"%";
  let h=`<div class="tags"><span class="tag u">${q.u}</span><span class="tag">${KIND[q.k]}</span>${q.c?'<span class="tag">Caso</span>':""}</div>`;
  if(q.c) h+=`<p class="case">${esc(q.c.replace(/^Caso:\s*/,""))}</p>`;
  h+=`<p class="qt">${esc(q.q)}</p>`;
  if(q.k==="mc"||q.k==="mc2"){
    const type=q.k==="mc"?"radio":"checkbox";
    cur.opts.forEach((o,i)=>{h+=`<label class="opt" data-i="${i}"><input type="${type}" name="o" value="${i}"><span>${esc(o.x)}</span></label>`});
  }else if(q.k==="vf"){
    h+=`<label class="opt" data-i="V"><input type="radio" name="o" value="V"><span>Verdadero</span></label><label class="opt" data-i="F"><input type="radio" name="o" value="F"><span>Falso</span></label>`;
  }else if(q.k==="rel"){
    h+="<table>"+q.pairs.map((p,j)=>`<tr><td>${j+1}. ${esc(p[0])}</td><td><select data-j="${j}"><option value="">—</option>${cur.rights.map((r,k)=>`<option value="${k}">${esc(r)}</option>`).join("")}</select></td></tr>`).join("")+"</table>";
  }else{
    h+=`<textarea placeholder="Escribí tu respuesta…"></textarea>`;
  }
  h+=`<div id="fb"></div>`;
  $("#qcard").innerHTML=h;
  $("#check").hidden=false;$("#check").disabled=false;$("#next").hidden=true;
  $("#next").textContent=idx===pool.length-1?"Ver resultado":"Siguiente";
  window.scrollTo({top:0});
}

function fb(cls,head,body,extra=""){return `<div class="fb ${cls}"><b class="v">${head}</b>${esc(body||"")}${extra}</div>`}

function check(){
  if(checked) return;checked=true;
  const q=pool[idx];let pts=0,html="";
  const card=$("#qcard");
  if(q.k==="mc"||q.k==="mc2"){
    const sel=[...card.querySelectorAll("input:checked")].map(x=>+x.value);
    const good=cur.opts.map((o,i)=>o.ok?i:-1).filter(i=>i>=0);
    pts=(sel.length===good.length&&sel.every(i=>good.includes(i)))?1:0;
    card.querySelectorAll("label.opt").forEach(l=>{const i=+l.dataset.i;l.querySelector("input").disabled=true;
      if(good.includes(i)) l.classList.add("ok"); else if(sel.includes(i)) l.classList.add("bad")});
    html=fb(pts?"ok":"bad",pts?"✔ Correcta":"✘ Incorrecta",q.e);
  }else if(q.k==="vf"){
    const sel=card.querySelector("input:checked")?.value;
    const good=q.a?"V":"F";pts=sel===good?1:0;
    card.querySelectorAll("label.opt").forEach(l=>{l.querySelector("input").disabled=true;
      if(l.dataset.i===good) l.classList.add("ok"); else if(l.dataset.i===sel) l.classList.add("bad")});
    html=fb(pts?"ok":"bad",pts?"✔ Correcta":`✘ Incorrecta · era ${q.a?"Verdadero":"Falso"}`,q.e);
  }else if(q.k==="rel"){
    let ok=0;
    card.querySelectorAll("select").forEach(s=>{s.disabled=true;const j=+s.dataset.j;
      const g=s.value!==""&&cur.rights[+s.value]===q.pairs[j][1];s.classList.add(g?"ok":"bad");if(g) ok++});
    pts=ok/q.pairs.length;
    html=fb(ok===q.pairs.length?"ok":ok?"mid":"bad",`${ok===q.pairs.length?"✔":"~"} ${ok}/${q.pairs.length} correctas`,q.e,
      "<ul>"+q.pairs.map((p,j)=>`<li>${esc(p[0])} → ${esc(p[1])}</li>`).join("")+"</ul>");
  }else{
    card.querySelector("textarea").disabled=true;
    html=`<div class="fb mid"><b class="v">Autoevaluación: marcá lo que tu respuesta incluyó</b><div class="rub">${q.rub.map(r=>`<label><input type="checkbox" class="rb"> <span>${esc(r)}</span></label>`).join("")}</div><p><b>Respuesta modelo:</b> ${esc(q.model)}</p></div>`;
    pts=null;
  }
  $("#fb").innerHTML=html;
  results[idx]={q,pts};
  $("#check").hidden=true;$("#next").hidden=false;
}

function next(){
  const q=pool[idx];
  if(q.k==="dev"){const b=[...document.querySelectorAll(".rb")];results[idx]={q,pts:b.filter(x=>x.checked).length/b.length}}
  idx++;
  if(idx>=pool.length) finish(); else show();
}

function finish(){
  clearInterval(timer);
  $("#play").hidden=true;$("#end").hidden=false;
  const total=results.reduce((a,r)=>a+r.pts,0),n=pool.length;
  const byU={};results.forEach(r=>{const o=byU[r.q.u]||(byU[r.q.u]={s:0,n:0});o.s+=r.pts;o.n++});
  const weak=results.filter(r=>r.pts<1);
  const pct=Math.round(total/n*100);
  $("#end").innerHTML=`<div class="card"><h2 style="margin:0 0 4px">Resultado</h2>
    <div class="score">${total.toFixed(1).replace(/\.0$/,"")} / ${n} <span class="hint">(${pct}%)</span></div>
    <p class="hint">Tiempo: ${$("#clock").textContent}. Las de desarrollo cuentan según lo que marcaste en la autoevaluación.</p>
    <h3>Por unidad</h3>
    ${Object.keys(byU).sort().map(u=>{const o=byU[u],p=Math.round(o.s/o.n*100);return `<div class="unit-row"><b style="width:28px">${u}</b><div class="ub"><i style="width:${p}%"></i></div><span class="meta">${o.s.toFixed(1).replace(/\.0$/,"")}/${o.n}</span></div>`}).join("")}
    </div>
    <div class="card"><h3 style="margin-top:0">Temas a repasar (${weak.length})</h3>
    ${weak.length?`<ul class="rev">${weak.map(r=>`<li><b>${r.q.u}</b> · ${esc(r.q.t)} <span class="hint">(${KIND[r.q.k]})</span></li>`).join("")}</ul>
    <p class="hint">Teoría: «Resumen Integrador Final - Unidades 1 a 5.md» y «Guia de Estudio - Preguntas de Parcial.md».</p>`:"<p>Sin errores. Impecable.</p>"}
    </div>
    <div class="actions">
      ${weak.length?'<button id="redo">Repetir solo las falladas</button>':""}
      <button class="sec" id="again">Repetir este modo</button>
      <button class="sec" id="tomenu">Menú</button>
    </div>`;
  if(weak.length) $("#redo").onclick=()=>start("redo",shuffle(weak.map(r=>r.q)));
  $("#again").onclick=()=>start(lastMode==="redo"?"mix":lastMode);
  $("#tomenu").onclick=showMenu;
  window.scrollTo({top:0});
}

$("#menu").addEventListener("click",e=>{const b=e.target.closest(".mode");if(b) start(b.dataset.m)});
$("#check").onclick=check;$("#next").onclick=next;
$("#quit").onclick=()=>{clearInterval(timer);showMenu()};
showMenu();
</script>
</body>
</html>
